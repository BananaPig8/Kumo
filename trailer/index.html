<style>
  /* Sala de cine: todo gira en torno al fotograma 16:9 y su banda negra. Un solo tema oscuro a propósito. */
  :root {
    --night: #07080b;
    --ink: #0d1016;
    --paper: #f4efe4;
    --mist: #b9c2cf;
    --gold: #e9c98a;

  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--paper); overflow: hidden; font-family: var(--font-text); }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); }
  .frame {
    position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%;

  }
  #gl { position: absolute; left: 0; top: 12.963%; width: 100%; height: 74.074%; display: block; }

  .title { position: absolute; inset: 12.963% 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .title .kanji {
    margin: 0 0 1.2cqw; font: 600 3.4cqw/1 var(--font-kanji); color: var(--gold); opacity: 0;
    text-shadow: 0 0 1.4cqw rgba(255, 210, 140, 0.55);
  }
  .title h1 {
    margin: 0; font: 500 9.6cqw/1 var(--font-title); letter-spacing: 0.42em; padding-left: 0.42em;

  }
  .title h1 span { display: inline-block; opacity: 0; }
  .title .sub { margin: 1.6cqw 0 0; font: 400 1.75cqw/1 var(--font-title); letter-spacing: 0.46em; padding-left: 0.46em; color: #fff3df; opacity: 0; text-shadow: 0 0 1cqw rgba(0, 0, 0, 0.45); }
  .title .rule { width: 0; height: 1px; margin: 1.9cqw auto 1.5cqw; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  .title .soon { margin: 2.2cqw 0 0; font: 400 1.25cqw/1 var(--font-title); letter-spacing: 0.6em; padding-left: 0.6em; color: var(--gold); opacity: 0; }

  .intro {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 2.2cqw; text-align: center;
    background: radial-gradient(ellipse at 50% 60%, #1b2433 0%, var(--ink) 55%, #000 100%);

  .intro .kicker { margin: 0; font: 400 1.2cqw/1 var(--font-title); letter-spacing: 0.5em; padding-left: 0.5em; color: var(--mist); }
  .intro h2 { margin: 0; font: 500 6cqw/1 var(--font-title); letter-spacing: 0.3em; padding-left: 0.3em; color: var(--paper); }
  .intro p.note { margin: 0; font: italic 400 1.7cqw/1.3 var(--font-text); color: var(--mist); }
  .play {
    justify-self: center; display: inline-flex; align-items: center; gap: 0.9cqw;
    padding: 1.05cqw 2.4cqw; border-radius: 999px; border: 1px solid rgba(233, 201, 138, 0.6);

    font: 500 1.45cqw/1 var(--font-title); letter-spacing: 0.25em; cursor: pointer;
    transition: background 0.25s, border-color 0.25s;
  }
  .play:hover { background: rgba(233, 201, 138, 0.2); border-color: var(--gold); }
  .play:focus-visible, .ctrl button:focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
  .play[disabled] { opacity: 0.5; cursor: progress; }
  .play svg { width: 1.2cqw; height: 1.2cqw; fill: currentColor; }
  .ctrl {
    position: absolute; right: 1.6cqw; bottom: 1.4cqw; display: flex; gap: 0.7cqw; flex-wrap: wrap; justify-content: flex-end;
    opacity: 0; transition: opacity 0.4s;
  }
  .frame:hover .ctrl, .ctrl:focus-within { opacity: 1; }
  .ctrl button {
    min-height: 32px; padding: 0.5cqw 1.1cqw; border-radius: 999px; border: 1px solid rgba(244, 239, 228, 0.35);
    background: rgba(7, 8, 11, 0.55); color: var(--paper); font: 400 max(11px, 0.95cqw)/1 var(--font-title); letter-spacing: 0.15em; cursor: pointer;
  }
  .ctrl button:hover { border-color: var(--paper); }
  .progress { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--gold); opacity: 0.6; }

    .ctrl { opacity: 1; }
    .intro .play { font-size: 12px; padding: 10px 18px; }
    .play svg { width: 11px; height: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { .ctrl, .play { transition: none; } }
  body.capture .intro, body.capture .ctrl, body.capture .progress { display: none; }
